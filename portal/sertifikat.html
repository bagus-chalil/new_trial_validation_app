<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="cert.title">Pemasangan Sertifikat QAC</title>
<meta name="theme-color" content="#EA1D22">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="i18n.js"></script>
<style>
  :root {
    --brand: #EA1D22;
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --border: #e5e7eb;
    --ok: #15803d;
    --ok-bg: rgba(22, 163, 74, 0.12);
    --warn-bg: rgba(234, 29, 34, 0.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101114;
      --card-bg: #17181c;
      --text: #f2f3f5;
      --muted: #9aa0ab;
      --border: #2a2c31;
      --ok: #4ade80;
      --ok-bg: rgba(74, 222, 128, 0.14);
      --warn-bg: rgba(234, 29, 34, 0.14);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.55;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 16px 48px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .back {
    display: inline-block;
    color: var(--muted);
    font-size: 0.9rem;
    text-decoration: none;
  }

  .back:hover { color: var(--text); text-decoration: underline; }

  h1 { font-size: 1.6rem; margin: 0 0 8px; }

  .lead { color: var(--muted); margin: 0 0 20px; }

  .status {
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.92rem;
    background: var(--warn-bg);
  }

  .status.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }

  .status[hidden] { display: none; }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .tabs button {
    font: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    cursor: pointer;
  }

  .tabs button[aria-selected="true"] {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    border: 0;
    background: var(--brand);
    color: #fff;
    font: inherit;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    margin: 4px 0 16px;
  }

  .btn:hover { filter: brightness(0.92); }

  .btn:disabled { opacity: 0.6; cursor: progress; }

  section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  section[hidden] { display: none; }

  h2 { font-size: 1.05rem; margin: 0 0 8px; }

  h3 { font-size: 0.95rem; margin: 18px 0 6px; }

  ol { margin: 0; padding-left: 20px; }

  li + li { margin-top: 6px; }

  .hint { color: var(--muted); font-size: 0.88rem; margin: 10px 0 0; }

  .error { color: var(--brand); font-size: 0.9rem; margin: 0 0 12px; }

  .error:empty { display: none; }

  details { margin-top: 16px; }

  summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; }

  details ol { margin-top: 10px; }

  .note { color: var(--muted); font-size: 0.9rem; margin-top: 20px; }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="back" href="./" data-i18n="cert.back"></a>
      <div data-lang-switch></div>
    </div>

    <h1 data-i18n="cert.heading"></h1>
    <p class="lead" data-i18n="cert.lead"></p>

    <div class="status" id="status" hidden></div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-os="windows" aria-selected="false">Windows</button>
      <button type="button" role="tab" data-os="android" aria-selected="false">Android</button>
      <button type="button" role="tab" data-os="ios" aria-selected="false">iPad / iPhone</button>
    </div>

    <section data-os="windows" hidden>
      <h2>Windows (Chrome / Edge)</h2>
      <button type="button" class="btn" id="setup-windows" data-i18n="cert.win.download"></button>
      <p class="error" id="setup-error"></p>
      <ol>
        <li data-i18n="cert.win.s1"></li>
        <li data-i18n="cert.win.s2"></li>
        <li data-i18n="cert.win.s3"></li>
        <li data-i18n="cert.win.s4"></li>
        <li data-i18n="cert.win.s5"></li>
      </ol>
      <p class="hint" data-i18n="cert.win.hint"></p>

      <details>
        <summary data-i18n="cert.win.manual"></summary>
        <ol>
          <li data-i18n="cert.win.m1"></li>
          <li data-i18n="cert.win.m2"></li>
          <li data-i18n="cert.win.m3"></li>
          <li data-i18n="cert.win.m4"></li>
        </ol>
      </details>
    </section>

    <section data-os="android" hidden>
      <h2>Android (Chrome)</h2>
      <a class="btn" href="qac-root-ca.crt" download data-i18n="cert.download"></a>
      <h3 data-i18n="cert.step1"></h3>
      <ol>
        <li data-i18n="cert.and.s1"></li>
        <li data-i18n="cert.and.s2"></li>
        <li data-i18n="cert.and.s3"></li>
        <li data-i18n="cert.and.s4"></li>
      </ol>
      <h3 data-i18n="cert.and.step2"></h3>
      <ol>
        <li data-i18n="cert.and.i1"></li>
        <li data-i18n="cert.and.i2"></li>
        <li data-i18n="cert.and.i3"></li>
      </ol>
      <p class="hint" data-i18n="cert.and.hint"></p>
    </section>

    <section data-os="ios" hidden>
      <h2>iPad / iPhone</h2>
      <a class="btn" href="qac-root-ca.crt" data-i18n="cert.download"></a>
      <h3 data-i18n="cert.step1"></h3>
      <ol>
        <li data-i18n="cert.ios.s1"></li>
        <li data-i18n="cert.ios.s2"></li>
        <li data-i18n="cert.ios.s3"></li>
      </ol>
      <h3 data-i18n="cert.ios.step2"></h3>
      <ol>
        <li data-i18n="cert.ios.i1"></li>
        <li data-i18n="cert.ios.i2"></li>
      </ol>
      <p class="hint" data-i18n="cert.ios.hint"></p>
    </section>

    <p class="note" data-i18n="cert.note"></p>
  </div>

  <script src="setup.js"></script>
  <script>
    var qac = window.QacSetup;
    var tabs = document.querySelectorAll('.tabs button');
    var sections = document.querySelectorAll('section[data-os]');

    function show(os) {
      tabs.forEach(function (tab) { tab.setAttribute('aria-selected', String(tab.dataset.os === os)); });
      sections.forEach(function (section) { section.hidden = section.dataset.os !== os; });
    }

    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        show(tab.dataset.os);
        history.replaceState(null, '', '#' + tab.dataset.os);
      });
    });

    var initial = location.hash.slice(1);
    if (['windows', 'android', 'ios'].indexOf(initial) === -1) {
      initial = qac.platform() === 'other' ? 'windows' : qac.platform();
    }
    show(initial);

    qac.checkTrusted().then(function (trusted) {
      var status = document.getElementById('status');
      status.hidden = false;
      if (trusted) {
        status.className = 'status ok';
        window.QacI18n.set(status, 'cert.statusOk');
      } else {
        window.QacI18n.set(status, 'cert.statusMissing');
      }
    });

    document.getElementById('setup-windows').addEventListener('click', function () {
      var button = this;
      var error = document.getElementById('setup-error');
      button.disabled = true;
      error.textContent = '';
      qac.downloadWindowsSetup().catch(function (err) {
        error.textContent = err.message;
      }).then(function () {
        button.disabled = false;
      });
    });
  </script>
</body>
</html>
