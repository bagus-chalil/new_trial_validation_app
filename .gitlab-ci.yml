# CI/CD for this monorepo (legacy PHP app, new_trial_validation_app, ipc_app).
# GitHub mirrors every branch here (see .github/workflows/mirror-to-gitlab.yml),
# but only `production` and `development` actually run deploy jobs, on the
# on-premise GitLab Runner. See deploy/README.md.
#
# Two stages, in order:
#   1. deploy      - rsync the whole repo to DEPLOY_PATH (all 3 apps + portal).
#                    Always runs on every push to production/development.
#   2. build_apps  - for new_trial_validation_app/ipc_app only: composer
#                    install, npm ci && npm run build, artisan migrate/
#                    storage:link against the code the deploy stage just
#                    synced. Only runs when that app's own files changed
#                    (`rules: changes:`), so a legacy-only push stays fast.
# build_apps jobs run in a later stage than deploy on purpose, so they never
# race the rsync that puts their source there first.

stages:
  - deploy
  - build_apps

.deploy_legacy:
  tags:
    - onprem-legacy
  script:
    - test -n "$DEPLOY_PATH" || (echo "DEPLOY_PATH is not set for this job/environment" && exit 1)
    - >
      rsync -a --no-owner --no-group --no-times --delete-after
      --exclude='.git/'
      --exclude='.gitlab-ci.yml'
      --exclude='config/database.php'
      --exclude='config/sso.php'
      --exclude='storage/sessions/'
      --exclude='public/uploads/'
      --exclude='portal/config.js'
      --exclude='new_trial_validation_app/.env'
      --exclude='new_trial_validation_app/storage/'
      --exclude='new_trial_validation_app/bootstrap/cache/'
      --exclude='new_trial_validation_app/vendor/'
      --exclude='new_trial_validation_app/node_modules/'
      --exclude='new_trial_validation_app/public/build/'
      --exclude='new_trial_validation_app/public/hot'
      --exclude='new_trial_validation_app/public/storage'
      --exclude='new_trial_validation_app/bootstrap/ssr/'
      --exclude='new_trial_validation_app/resources/js/actions/'
      --exclude='new_trial_validation_app/resources/js/routes/'
      --exclude='new_trial_validation_app/resources/js/wayfinder/'
      --exclude='new_trial_validation_app/.phpunit.cache/'
      --exclude='new_trial_validation_app/.phpunit.result.cache'
      --exclude='new_trial_validation_app/.env.backup'
      --exclude='new_trial_validation_app/.env.production'
      --exclude='new_trial_validation_app/npm-debug.log'
      --exclude='ipc_app/.env'
      --exclude='ipc_app/storage/'
      --exclude='ipc_app/bootstrap/cache/'
      --exclude='ipc_app/vendor/'
      --exclude='ipc_app/node_modules/'
      --exclude='ipc_app/public/build/'
      --exclude='ipc_app/public/hot'
      --exclude='ipc_app/public/storage'
      --exclude='ipc_app/bootstrap/ssr/'
      --exclude='ipc_app/resources/js/actions/'
      --exclude='ipc_app/resources/js/routes/'
      --exclude='ipc_app/resources/js/wayfinder/'
      --exclude='ipc_app/.phpunit.cache/'
      --exclude='ipc_app/.phpunit.result.cache'
      --exclude='ipc_app/.env.backup'
      --exclude='ipc_app/.env.production'
      --exclude='ipc_app/npm-debug.log'
      "$CI_PROJECT_DIR/" "$DEPLOY_PATH/"
    - echo "Deployed $CI_COMMIT_SHORT_SHA to $DEPLOY_PATH ($CI_ENVIRONMENT_NAME)"

deploy_legacy_production:
  extends: .deploy_legacy
  stage: deploy
  environment:
    name: production
  variables:
    DEPLOY_PATH: $DEPLOY_PATH_PRODUCTION
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'

deploy_legacy_development:
  extends: .deploy_legacy
  stage: deploy
  environment:
    name: development
  variables:
    DEPLOY_PATH: $DEPLOY_PATH_DEVELOPMENT
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'

.build_app:
  tags:
    - onprem-legacy
  script:
    - test -n "$DEPLOY_PATH" || (echo "DEPLOY_PATH is not set for this job/environment" && exit 1)
    - test -n "$APP_DIR" || (echo "APP_DIR is not set for this job/environment" && exit 1)
    - test -f "$DEPLOY_PATH/$APP_DIR/.env" || (echo "$DEPLOY_PATH/$APP_DIR/.env is missing - create it manually first (see deploy/README.md), this job will not create one" && exit 1)
    - cd "$DEPLOY_PATH/$APP_DIR"
    - composer install --no-interaction --prefer-dist
    - chgrp -R www-data storage bootstrap/cache 2>/dev/null || true
    - chmod -R ug+rwX storage bootstrap/cache
    - php artisan optimize:clear
    - npm ci
    - npx puppeteer browsers install chrome chrome-headless-shell
    - npm run build
    - php artisan storage:link
    - php artisan migrate --force
    - echo "Built and migrated $APP_DIR at $DEPLOY_PATH ($CI_ENVIRONMENT_NAME)"

build_new_trial_validation_app_production:
  extends: .build_app
  stage: build_apps
  environment:
    name: production
  variables:
    DEPLOY_PATH: $DEPLOY_PATH_PRODUCTION
    APP_DIR: new_trial_validation_app
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes:
        - new_trial_validation_app/**/*

build_new_trial_validation_app_development:
  extends: .build_app
  stage: build_apps
  environment:
    name: development
  variables:
    DEPLOY_PATH: $DEPLOY_PATH_DEVELOPMENT
    APP_DIR: new_trial_validation_app
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      changes:
        - new_trial_validation_app/**/*

build_ipc_app_production:
  extends: .build_app
  stage: build_apps
  environment:
    name: production
  variables:
    DEPLOY_PATH: $DEPLOY_PATH_PRODUCTION
    APP_DIR: ipc_app
  rules:
    - if: '$CI_COMMIT_BRANCH == "production"'
      changes:
        - ipc_app/**/*

build_ipc_app_development:
  extends: .build_app
  stage: build_apps
  environment:
    name: development
  variables:
    DEPLOY_PATH: $DEPLOY_PATH_DEVELOPMENT
    APP_DIR: ipc_app
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
      changes:
        - ipc_app/**/*
